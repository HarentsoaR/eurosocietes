name: eurosocietes-prod

services:
  app:
    image: harentsoa/eurosocietes:latest
    container_name: eurosocietes-prod-app
    working_dir: /var/www/html
    environment:
      APP_NAME: "EuroSocietes"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:-base64:InjixphOlo0nbgYuJtM2xenkupTFmJtYY5zcrEByCHU=}
      APP_LOCALE: fr
      APP_FALLBACK_LOCALE: fr
      APP_TIMEZONE: Europe/Paris
      BCRYPT_ROUNDS: "12"
      LOG_CHANNEL: stack
      LOG_STACK: daily
      LOG_LEVEL: debug
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: eurosocietes
      DB_USERNAME: eurosocietes
      DB_PASSWORD: eurosocietes
      DB_DATABASE_TEST: eurosocietes_test
      SESSION_DRIVER: redis
      SESSION_LIFETIME: "120"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SANCTUM_TOKEN_EXPIRATION_DAYS: "7"
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
    ports:
      - "8000:8000"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eurosocietes

  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: eurosocietes-prod-postgres
    environment:
      POSTGRES_DB: eurosocietes
      POSTGRES_USER: eurosocietes
      POSTGRES_PASSWORD: eurosocietes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurosocietes -d eurosocietes"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eurosocietes

  redis:
    image: redis:7-alpine
    container_name: eurosocietes-prod-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eurosocietes

networks:
  eurosocietes:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_storage:
