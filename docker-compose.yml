name: eurosocietes

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: eurosocietes/php:8.4
    container_name: eurosocietes-app
    # FIX: Removed incorrect entrypoint: eurosocietes-app
    # The Dockerfile's ENTRYPOINT ["docker-entrypoint"] will be used
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      PHP_OPCACHE_ENABLE: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eurosocietes

  composer:
    image: composer:2
    container_name: eurosocietes-composer
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - eurosocietes
    profiles:
      - tools

  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: eurosocietes-postgres
    environment:
      POSTGRES_DB: eurosocietes
      POSTGRES_USER: eurosocietes
      POSTGRES_PASSWORD: eurosocietes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurosocietes -d eurosocietes"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eurosocietes

  redis:
    image: redis:7-alpine
    container_name: eurosocietes-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eurosocietes

networks:
  eurosocietes:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
